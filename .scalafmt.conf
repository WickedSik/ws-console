# scalafmt configuration for ws-console.
#
# Derived from the conventions already present in src/. Keep this file the
# single source of formatting truth: IntelliJ and Metals both honour it, so
# nothing should override it in editor settings.
#
# Run:
#   sbt scalafmtAll            # format main + test sources
#   sbt scalafmtCheckAll       # verify without writing
#   sbt scalafmtSbt            # format build.sbt and project/*.sbt

version = "3.8.3"

runner.dialect = scala3

maxColumn = 120

# ----- Indentation -----------------------------------------------------------
# 2-space everywhere, matching every file in src/.
indent.main         = 2
indent.callSite     = 2
indent.defnSite     = 2
indent.ctrlSite     = 2
indent.extendSite   = 2
indent.withSiteRelativeToExtends = 2

# ----- Scala 3 significant indentation --------------------------------------
# The codebase uses `:`-indented syntax for class/trait/object/enum/def
# bodies (see CLAUDE.md). Enforce that and strip optional braces where the
# Scala 3 grammar accepts significant indentation.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 0   # never auto-insert `end` markers

# ----- Alignment -------------------------------------------------------------
# Only align match-arm arrows (`=>`). `align.preset = more` was tried and
# over-reached: it aligned `=` in adjacent `var`/`val` declarations
# (turning `var i = 0` into `var i        = 0` next to a longer
# neighbour) and `extends` in nested case objects. Both add noise, not
# clarity. Case-class colon alignment is also NOT enforced: only a
# handful of case classes use it.
align.preset               = none
align.tokens               = [
  { code = "=>", owner = "Case" },
  { code = "<-" },
  { code = "->", owner = "Term.ApplyInfix" }
]
align.openParenCallSite    = false
align.openParenDefnSite    = false
align.arrowEnumeratorGenerator = true

# ----- Newlines --------------------------------------------------------------
# Preserve the author's blank lines — they're used as logical section
# breaks throughout the codebase (see e.g. EventParser's `// ===== ... =====`
# separators). Do NOT force blank lines between nested case objects or
# top-level statements: adjacent ADT variants are grouped intentionally
# (see ParserState in EventParser.scala).
newlines.source                 = keep
newlines.topLevelStatements     = []
newlines.beforeMultiline        = keep
newlines.afterCurlyLambdaParams = keep
newlines.implicitParamListModifierPrefer = before

# Do not force a blank line before docstrings — the codebase places
# docstrings directly against the preceding ADT variant or member (see
# ParserState in event/EventParser.scala) and injecting blanks would
# fragment logically-grouped variants.
optIn.forceBlankLineBeforeDocstring = false

# ----- Docstrings ------------------------------------------------------------
# ScalaDoc in this project uses the `Asterisk` shape:
#   /**
#    * text
#    */
# Do NOT auto-wrap prose; several docstrings contain tables and code
# fragments whose layout matters (see build.sbt comments, Cell.scala).
docstrings.style      = Asterisk
docstrings.wrap       = no
docstrings.oneline    = keep

# ----- Trailing commas -------------------------------------------------------
# The codebase mixes trailing-comma and no-trailing-comma styles; keep
# whatever the author wrote rather than churning it.
rewrite.trailingCommas.style = keep

# ----- Rewrites --------------------------------------------------------------
# Light-touch cleanup only. Aggressive import rewriting is intentionally
# omitted: the manual grouping of project-internal / third-party / JDK
# imports with blank lines is deliberate (see CLAUDE.md § Import
# Management) and scalafmt's `Imports` rewrite would fight it.
rewrite.rules = [
  RedundantBraces,
  RedundantParens,
  SortModifiers,
  PreferCurlyFors
]
rewrite.redundantBraces.stringInterpolation = true
rewrite.redundantBraces.parensForOneLineApply = true
rewrite.redundantBraces.ifElseExpressions = false
rewrite.redundantBraces.methodBodies = false        # keep `def x = { ... }` if author chose it

# ----- Literals --------------------------------------------------------------
# Preserve the codebase's convention: uppercase hex digits (`0xFF`, not
# `0xff`), lowercase `0x` prefix. See event/EventParser.scala,
# ansi/AnsiBuilder.scala.
literals.hexDigits = Upper
literals.hexPrefix = Lower
literals.long      = Upper       # 1L, not 1l

# ----- Project scope ---------------------------------------------------------
# Include the SBT build files and everything under src/.
project.git = true
project.includePaths = [
  "glob:**/*.scala",
  "glob:**/*.sbt",
  "glob:**/*.sc"
]
project.excludePaths = [
  "glob:**/target/**",
  "glob:**/.bloop/**",
  "glob:**/.metals/**"
]

# ----- File overrides --------------------------------------------------------
# build.sbt uses sbt1 dialect (not scala3) because it accepts `key := value`
# infix DSL that scala3 would reject.
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala213source3
  }
}
